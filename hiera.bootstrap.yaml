---
# BOOTSTRAP hiera config when building a Puppet server from scratch.
# This contains just the bare minimum to stand up a working Puppetserver and get things
# up and running again as quickly as possible.
version: 5

defaults:
  datadir: .
  data_hash: yaml_data

hierarchy:

    - name: "Common data (yaml version)"
      paths:
          - "data/common/%{environment}.yaml"

    - name: "Common secrets (eyaml)"
      lookup_key: eyaml_lookup_key
      options:
          pkcs7_private_key: /etc/puppetlabs/puppet/keys/private_key.pkcs7.pem
          pkcs7_public_key:  /etc/puppetlabs/puppet/keys/public_key.pkcs7.pem
      paths:
          - "data/bootstrap/production.eyaml"
          - "data/common/production.eyaml"
