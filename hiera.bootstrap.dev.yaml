---
# BOOTSTRAP hiera config when building a Puppet server from scratch for our dev environment.
# We need to keep this in its own hiera file as we may use different values when running in dev
# especially if we're testing upgrading the Puppetserver
version: 5

defaults:
  datadir: .
  data_hash: yaml_data

hierarchy:

    - name: "Common data (yaml version)"
      paths:
          - "data/common/dev.yaml"

    - name: "Common secrets (eyaml)"
      lookup_key: eyaml_lookup_key
      options:
          pkcs7_private_key: /etc/puppetlabs/puppet/keys/private_key.pkcs7.pem
          pkcs7_public_key:  /etc/puppetlabs/puppet/keys/public_key.pkcs7.pem
      paths:
          - "data/bootstrap/dev.eyaml"
          - "data/common/dev.eyaml"
